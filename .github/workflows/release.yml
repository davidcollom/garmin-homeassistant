# Publish the container image of the bridge.
#
# The image is built for every tag and pushed to the GitHub container
# registry, so that it can be pulled with:
#
#     docker pull ghcr.io/${{ github.repository }}/bridge:latest
#
name: Container image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/bridge:latest
            ghcr.io/${{ github.repository }}/bridge:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
