# Dependabot configuration.
#
# The test requirements are pinned on purpose, the Home Assistant test harness
# in particular only works with the pytest release it was built for.
version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
      day: monday
    # The updates are not grouped.  A group would move the Home Assistant
    # version, the test harness and the tools of the bridge in one step, and
    # the Home Assistant version is a deliberate decision, not an automatic
    # one.
    ignore:
      # The Home Assistant version and the test harness belong together.
      # Moving them means testing the integration against a new Home
      # Assistant, which is done on purpose and not by a bot.
      - dependency-name: "homeassistant"
      - dependency-name: "pytest-homeassistant-custom-component"
      # The test harness pins the pytest plugins to exact versions, so a
      # newer release of one of them cannot be installed next to it.
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      - dependency-name: pytest-aiohttp
      - dependency-name: pytest-cov
      - dependency-name: pytest-socket
      - dependency-name: respx
      # josepy 2 drops the API that acme uses, which breaks the import of
      # hass_nabucasa.  The newer releases of acme do not work with the
      # pinned josepy either, so both stay where they are.
      - dependency-name: josepy
      - dependency-name: acme
      # pycares 4.11 starts a background thread that outlives the event
      # loop, which the Home Assistant test harness reports as a leaked
      # thread.
      - dependency-name: pycares
