[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["custom_components/garmin_homeassistant/tests"]
norecursedirs = [".git", ".venv", ".venv-ha", "bridge", "watch", "docs"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["bridge"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "D"]
ignore = ["E501", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"custom_components/garmin_homeassistant/tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "custom_components.garmin_homeassistant.tests.*"
disallow_untyped_defs = false
